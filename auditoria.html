<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría | TechNova</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dash-body">

    <div class="mobile-topbar">
        <span class="brand">🔷 TechNova</span>
        <button class="btn-menu-toggle" id="btnMenuToggle"><i class="fa-solid fa-bars"></i></button>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="dash-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <img src="img/logo-icon.svg" alt="TechNova" width="36" height="34">
                TechNova
            </div>
            <nav class="sidebar-menu" id="sidebarMenu"></nav>
            <div class="sidebar-user">
                <strong id="sidebarNombre">Cargando...</strong>
                <span id="sidebarRol"></span>
            </div>
        </aside>


        <main class="dash-main">
            <div class="dash-header">
                <div>
                    <h1><i class="fa-solid fa-clock-rotate-left" style="color:#6d28d9;margin-right:10px;"></i>Auditoría del Sistema</h1>
                    <p id="saludo">Registro de actividades del sistema</p>
                </div>
                <div style="display:flex;align-items:center;gap:10px;">
                    <div class="notif-wrapper" id="notifWrapper">
                        <button class="btn-notif" id="btnNotif" title="Notificaciones">
                            <i class="fa-solid fa-bell"></i>
                            <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
                        </button>
                        <div class="notif-dropdown" id="notifDropdown">
                            <div class="notif-header">
                                <h4>Notificaciones</h4>
                                <span onclick="marcarTodasLeidas()">Marcar todas leídas</span>
                            </div>
                            <div class="notif-list" id="notifList"></div>
                        </div>
                    </div>
                    <button class="btn-logout" onclick="cerrarSesion()">
                        <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
                    </button>
                </div>
            </div>

            <div class="table-card">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
                    <div>
                        <h3 style="font-size:1rem;font-weight:700;color:#0f172a;margin:0 0 2px;">
                            <i class="fa-solid fa-list-check" style="color:#6d28d9;margin-right:6px;"></i>
                            Registro de Actividades
                        </h3>
                        <p id="auditCount" style="font-size:.8rem;color:#64748b;margin:0;">Cargando...</p>
                    </div>
                </div>

                <div class="filtros-bar">
                    <button class="btn-filtro activo" onclick="filtrarAccion('todos', this)">Todos</button>
                    <button class="btn-filtro" onclick="filtrarAccion('Creación', this)">Creación</button>
                    <button class="btn-filtro" onclick="filtrarAccion('Edición', this)">Edición</button>
                    <button class="btn-filtro" onclick="filtrarAccion('Eliminación', this)">Eliminación</button>
                    <button class="btn-filtro" onclick="filtrarAccion('Sesión', this)">Sesión</button>
                    <button class="btn-filtro" onclick="filtrarAccion('Pago', this)">Pago</button>
                    <input type="date" class="input-busqueda" id="filtroFecha" style="width:180px;" oninput="aplicarFiltros()">
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Fecha y Hora</th>
                                <th>Usuario</th>
                                <th>Acción</th>
                                <th>Módulo</th>
                                <th>Detalle</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyAudit"></tbody>
                    </table>
                </div>

                <div class="pagination" id="paginacion"></div>
            </div>
        </main>
    </div>

<script>
// Variables globales
let filtroAccion = ''; // Vacío significa 'todos'
let paginaActual = 1;

// Función auxiliar para escapar HTML y evitar XSS
function escH(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function getAccionBadge(a) {
    const m = {
        'Creación':  ['#d1fae5','#059669'],
        'Edición':   ['#dbeafe','#1d4ed8'],
        'Eliminación':['#fee2e2','#dc2626'],
        'Sesión':    ['#f1f5f9','#475569'],
        'Pago':      ['#fef3c7','#d97706'],
    };
    const [bg,col] = m[a] || ['#f1f5f9','#475569'];
    return `<span style="display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600;background:${bg};color:${col};">${a}</span>`;
}

function getModuloIcon(mod) {
    const icons = {
        'proyecto':'fa-diagram-project', 'pago':'fa-hand-holding-dollar', 'usuario':'fa-users',
        'factura':'fa-file-invoice-dollar', 'servicio':'fa-screwdriver-wrench',
        'entregable':'fa-clipboard-check', 'incidencia':'fa-triangle-exclamation'
    };
    // Convertimos a minúsculas para que coincida mejor con los nombres de tablas reales
    const modLower = (mod || '').toLowerCase();
    return icons[modLower] || 'fa-circle-info';
}

// ─── CONEXIÓN CON EL BACKEND ───
async function cargarAuditoria() {
    const tbody = document.getElementById('tbodyAudit');
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;"><i class="fa-solid fa-spinner fa-spin" style="color:#6d28d9;font-size:1.5rem;"></i><br><span style="color:#64748b;font-size:0.9rem;margin-top:10px;display:inline-block;">Cargando registros...</span></td></tr>`;

    // 1. Construir la URL con los parámetros GET
    let url = `php/consultar_auditoria.php?pagina=${paginaActual}`;
    
    if (filtroAccion && filtroAccion !== 'todos') {
        url += `&accion=${encodeURIComponent(filtroAccion)}`;
    }
    
    const fecha = document.getElementById('filtroFecha').value;
    if (fecha) {
        // Enviamos la misma fecha como inicio y fin para buscar en un solo día
        url += `&fecha_inicio=${fecha}&fecha_fin=${fecha}`;
    }

    try {
        // 2. Hacer la petición al PHP
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.error) {
            tbody.innerHTML = `<tr><td colspan="6" style="color:#dc2626;text-align:center;padding:40px;">Error: ${data.mensaje}</td></tr>`;
            if(data.mensaje.includes('Acceso denegado')) {
                setTimeout(() => window.location.href = 'dashboard.html', 2000);
            }
            return;
        }
        
        // 3. Renderizar los datos reales
        renderTabla(data);
        
    } catch (e) {
        console.error("Error cargando auditoría", e);
        tbody.innerHTML = `<tr><td colspan="6" style="color:#dc2626;text-align:center;padding:40px;">Error de conexión con el servidor.</td></tr>`;
    }
}

function renderTabla(data) {
    document.getElementById('auditCount').textContent = `${data.total_registros} registro${data.total_registros !== 1 ? 's' : ''} encontrado${data.total_registros !== 1 ? 's' : ''}`;
    const tbody = document.getElementById('tbodyAudit');
    
    if (!data.registros || data.registros.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="color:#94a3b8;text-align:center;padding:40px;">No se encontraron registros de auditoría</td></tr>`;
        document.getElementById('paginacion').innerHTML = '';
        return;
    }

    tbody.innerHTML = data.registros.map(r => {
        // Formatear la fecha que viene de MySQL (YYYY-MM-DD HH:MM:SS)
        const fechaFmt = new Date(r.fecha.replace(' ', 'T')).toLocaleString('es-SV', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
        
        return `
        <tr>
            <td style="font-weight:600;color:#6d28d9;">#${r.id}</td>
            <td style="font-size:.8rem;color:#64748b;white-space:nowrap;">${fechaFmt}</td>
            <td><strong>${escH(r.nombre_usuario || 'Sistema')}</strong></td>
            <td>${getAccionBadge(r.accion)}</td>
            <td>
                <i class="fa-solid ${getModuloIcon(r.entidad)}" style="color:#94a3b8;margin-right:4px;font-size:.75rem;"></i>
                <span style="text-transform: capitalize;">${escH(r.entidad || 'N/A')}</span>
            </td>
            <td style="font-size:.82rem;color:#475569;">${escH(r.descripcion)}</td>
        </tr>`;
    }).join('');

    renderPaginacion(data.total_paginas, data.pagina_actual);
}

function renderPaginacion(totalPaginas, actual) {
    const pag = document.getElementById('paginacion');
    if (totalPaginas <= 1) { pag.innerHTML = ''; return; }
    
    let html = `<button ${actual === 1 ? 'disabled' : ''} onclick="irPagina(${actual - 1})"><i class="fa-solid fa-chevron-left"></i></button>`;
    
    for (let i = 1; i <= totalPaginas; i++) {
        // Mostrar máximo 5 botones de página para no romper el diseño si hay muchas páginas
        if (i === 1 || i === totalPaginas || (i >= actual - 2 && i <= actual + 2)) {
            html += `<button class="${i === actual ? 'active' : ''}" onclick="irPagina(${i})">${i}</button>`;
        } else if (i === actual - 3 || i === actual + 3) {
            html += `<span style="padding:0 10px;color:#94a3b8;">...</span>`;
        }
    }
    
    html += `<button ${actual === totalPaginas ? 'disabled' : ''} onclick="irPagina(${actual + 1})"><i class="fa-solid fa-chevron-right"></i></button>`;
    html += `<span class="page-info">Página ${actual} de ${totalPaginas}</span>`;
    pag.innerHTML = html;
}

function irPagina(n) { 
    paginaActual = n; 
    cargarAuditoria(); 
}

function filtrarAccion(valor, btn) {
    document.querySelectorAll('.filtros-bar .btn-filtro').forEach(b => b.classList.remove('activo'));
    btn.classList.add('activo');
    filtroAccion = valor === 'todos' ? '' : valor;
    paginaActual = 1;
    cargarAuditoria();
}

function aplicarFiltros() { 
    paginaActual = 1; 
    cargarAuditoria(); 
}

function cerrarSesion() {
    fetch('php/logout.php').finally(() => { window.location.href = 'login.html'; });
}

// Obtenemos los datos de la sesión real antes de cargar la auditoría
async function init() {
    try {
        const resSesion = await fetch('php/dashboard_data.php');
        const dataSesion = await resSesion.json();
        
        if (dataSesion.error) {
            window.location.href = 'login.html';
            return;
        }

        document.getElementById('sidebarNombre').textContent = dataSesion.usuario;
        document.getElementById('sidebarRol').textContent = dataSesion.rol;
        document.getElementById('saludo').textContent = 'Bienvenido, ' + dataSesion.usuario + ' · ' + dataSesion.rol;
        
        // Cargar los registros reales de la BD
        cargarAuditoria();
        
    } catch (e) {
        console.error("Error validando sesión:", e);
    }
}
