<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | TechNova</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="main-header">
    <nav class="navbar">
        <div class="logo">
            <a href="index.html"><img src="img/logo.svg" alt="Logo TechNova" width="190" height="34"></a>
        </div>
        <div class="nav-actions">
            <a href="login.html" class="btn-login">Inicio de Sesión</a>
        </div>
    </nav>
</header>
<section class="login-wrapper">
    <div class="login-container">
        <h2><i class="fa-solid fa-key" style="color:#6d28d9;margin-right:8px;"></i>Recuperar contraseña</h2>
        <p style="color:#64748b;font-size:.85rem;margin-bottom:20px;">
            Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.
        </p>
        <div id="alerta" style="display:none;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:.9rem;"></div>
        <form id="formRecuperar">
            <div class="form-group" style="margin-bottom:24px;">
                <label>Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" required>
            </div>
            <button type="submit" class="btn-submit" id="btnEnviar">
                <span id="btnTexto">Enviar enlace</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
        <p style="text-align:center;margin-top:16px;font-size:.85rem;">
            <a href="login.html" style="color:#6d28d9;font-weight:600;">
                <i class="fa-solid fa-arrow-left" style="margin-right:4px;"></i>Volver al login
            </a>
        </p>
    </div>
</section>
<script>
document.getElementById('formRecuperar').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alerta   = document.getElementById('alerta');
    const btn      = document.getElementById('btnEnviar');
    const btnTexto = document.getElementById('btnTexto');

    btn.disabled = true;
    btnTexto.textContent = 'Generando...';

    const fd = new FormData();
    fd.append('email', document.getElementById('email').value.trim());

    try {
        const res  = await fetch('php/solicitar_recuperacion.php', { method:'POST', body:fd });
        const data = await res.json();

        if (data.error) {
            alerta.style.cssText = 'display:block;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:.9rem;background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;';
            alerta.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${data.mensaje}`;
        } else {
            alerta.style.cssText = 'display:block;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:.9rem;background:#d1fae5;color:#065f46;border:1px solid #6ee7b7;';
            alerta.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${data.mensaje}`;
            if (data.modoPrueba && data.enlacePrueba) {
                alerta.innerHTML += `<br><br><small style="font-weight:600;">
                    🔗 Modo prueba — 
                    <a href="${data.enlacePrueba}" style="color:#065f46;font-weight:700;text-decoration:underline;">
                        Abrir enlace de restablecimiento
                    </a>
                </small>`;
            }
        }
    } catch {
        alerta.style.cssText = 'display:block;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:.9rem;background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;';
        alerta.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Error de conexión con el servidor';
    } finally {
        btn.disabled = false;
        btnTexto.textContent = 'Enviar enlace';
    }
});
</script>
</body>
</html>
