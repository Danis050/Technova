<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contrasena | TechNova</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="main-header">
    <nav class="navbar">
        <div class="logo">
            <a href="index.html"><img src="img/logo.svg" alt="Logo TechNova" width="190" height="34"></a>
        </div>
        <div class="nav-actions">
            <a href="login.html" class="btn-login">Inicio de Sesion</a>
        </div>
    </nav>
</header>

<section class="login-wrapper">
    <div class="login-container">
        <h2><i class="fa-solid fa-key" style="color:#6d28d9;margin-right:8px;"></i>Recuperar contrasena</h2>
        <div id="alerta" style="display:none;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:0.9rem;"></div>

        <form id="formRecuperar">
            <div class="form-group" style="margin-bottom:24px;">
                <label>Correo electronico</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" required>
            </div>
            <button type="submit" class="btn-submit" id="btnEnviar">
                <span id="btnTexto">Enviar enlace</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>
</section>

<script>
document.getElementById('formRecuperar').addEventListener('submit', async (e) => {
    e.preventDefault();

    const alerta = document.getElementById('alerta');
    const btn = document.getElementById('btnEnviar');
    const btnTexto = document.getElementById('btnTexto');
    const formData = new FormData();
    formData.append('email', document.getElementById('email').value.trim());

    btn.disabled = true;
    btnTexto.textContent = 'Generando...';

    try {
        const res = await fetch('php/solicitar_recuperacion.php', { method: 'POST', body: formData });
        const data = await res.json();

        alerta.style.display = 'block';
        if (data.error) {
            alerta.style.cssText = 'display:block;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:.9rem;background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;';
            alerta.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${data.mensaje}`;
        } else {
            alerta.style.cssText = 'display:block;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:.9rem;background:#d1fae5;color:#065f46;border:1px solid #6ee7b7;';
            alerta.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${data.mensaje}`;
            if (data.modoPrueba && data.enlacePrueba) {
                alerta.innerHTML += `<br><small>Modo prueba: <a href="${data.enlacePrueba}" style="color:#065f46;font-weight:700;">abrir enlace generado</a></small>`;
            }
        }
    } catch (err) {
        alerta.style.cssText = 'display:block;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:.9rem;background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;';
        alerta.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Error de conexion con el servidor';
    } finally {
        btn.disabled = false;
        btnTexto.textContent = 'Enviar enlace';
    }
});
</script>
</body>
</html>
