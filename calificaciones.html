<script>
    const sidebar = document.getElementById('sidebar');
    const sidebarOvl = document.getElementById('sidebarOverlay');
    document.getElementById('btnMenuToggle').addEventListener('click', () => {
        sidebar.classList.toggle('open'); sidebarOvl.classList.toggle('visible');
    });
    sidebarOvl.addEventListener('click', () => {
        sidebar.classList.remove('open'); sidebarOvl.classList.remove('visible');
    });

    let calificaciones = [];

    let filtroEstrellasActual = 'todos';

    function escH(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

    function renderEstrellas(n) {
        let html = '';
        for (let i = 1; i <= 5; i++) {
            html += `<i class="fa-solid fa-star" style="color:${i<=n?'#fbbf24':'#d1d5db'};font-size:.85rem;"></i>`;
        }
        return html;
    }

    function renderEstrellasMini(n) {
        let html = '';
        for (let i = 1; i <= 5; i++) {
            html += `<i class="fa-solid fa-star" style="color:${i<=n?'#fbbf24':'#d1d5db'};font-size:.7rem;"></i>`;
        }
        return html;
    }

    function actualizarStats() {
        const total = calificaciones.length;
        const promedio = total > 0 ? (calificaciones.reduce((s,c) => s + c.estrellas, 0) / total).toFixed(1) : '0.0';
        document.getElementById('promedioGeneral').textContent = promedio;
        document.getElementById('promedioEstrellas').innerHTML = renderEstrellasMini(Math.round(parseFloat(promedio)));
        document.getElementById('totalCalificaciones').textContent = total;
        for (let i = 1; i <= 5; i++) {
            document.getElementById('calif' + i).textContent = calificaciones.filter(c => c.estrellas === i).length;
        }
    }

    function renderTabla(lista) {
        document.getElementById('califCount').textContent = `${lista.length} calificación${lista.length!==1?'es':''} encontrada${lista.length!==1?'s':''}`;
        const tbody = document.getElementById('tbodyCalif');
        if (lista.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="color:#94a3b8;text-align:center;padding:40px;">No se encontraron calificaciones</td></tr>`;
            return;
        }
        tbody.innerHTML = lista.map(c => {
            const fechaFmt = new Date(c.fecha).toLocaleDateString('es-SV', { day:'2-digit', month:'short', year:'numeric' });
            return `
            <tr>
                <td style="font-weight:600;color:#6d28d9;">#${c.id}</td>
                <td><strong>${escH(c.proyecto)}</strong></td>
                <td>${escH(c.cliente)}</td>
                <td style="white-space:nowrap;">${renderEstrellas(c.estrellas)} <span style="font-weight:700;margin-left:4px;">${c.estrellas}.0</span></td>
                <td style="font-size:.82rem;color:#475569;max-width:280px;">${escH(c.comentario)}</td>
                <td style="font-size:.8rem;color:#64748b;white-space:nowrap;">${fechaFmt}</td>
            </tr>`;
        }).join('');
    }

    function filtrarEstrellas(valor, btn) {
        document.querySelectorAll('.filtros-bar .btn-filtro').forEach(b => b.classList.remove('activo'));
        btn.classList.add('activo');
        filtroEstrellasActual = valor;
        const lista = valor === 'todos' ? calificaciones : calificaciones.filter(c => c.estrellas === valor);
        renderTabla(lista);
    }
