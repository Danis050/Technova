<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Proyectos | TechNova</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dash-body">
    <div class="mobile-topbar">
        <span class="brand">🔷 TechNova</span>
        <button class="btn-menu-toggle" id="btnMenuToggle"><i class="fa-solid fa-bars"></i></button>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="dash-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <img src="img/logo-icon.svg" alt="TechNova" width="36" height="34">
                TechNova
            </div>
            <nav class="sidebar-menu">
                <div class="menu-section-label">Mi Portal</div>
                <a href="mis_proyectos_empleado.html"><i class="fa-solid fa-diagram-project"></i> Mis Proyectos</a>
                <div class="menu-section-label" style="margin-top:8px;">Cuenta</div>
                <a href="perfil.html"><i class="fa-solid fa-user-circle"></i> Mi Perfil</a>
            </nav>
            <div class="sidebar-user">
                <strong id="sidebarNombre">Cargando...</strong>
                <span id="sidebarRol"></span>
            </div>
        </aside>

        <main class="dash-main">
            <div class="dash-header">
                <div>
                    <h1><i class="fa-solid fa-diagram-project" style="color:#6d28d9;margin-right:10px;"></i>Mis Proyectos</h1>
                    <p id="saludo">Proyectos asignados a tu cuenta</p>
                </div>
                <button class="btn-logout" onclick="cerrarSesion()">
                    <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
                </button>
            </div>

            <div id="loadingBox" style="text-align:center;padding:60px 20px;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;color:#6d28d9;"></i>
                <p style="margin-top:12px;color:#94a3b8;">Cargando tus proyectos...</p>
            </div>

            <div class="cards-grid" id="cardsGrid" style="display:none;"></div>

            <div id="emptyBox" style="display:none;text-align:center;padding:60px 20px;">
                <i class="fa-solid fa-folder-open" style="font-size:3rem;color:#cbd5e1;margin-bottom:16px;display:block;"></i>
                <h3 style="color:#334155;margin-bottom:8px;">No tienes proyectos asignados</h3>
                <p style="color:#94a3b8;">Cuando se te asigne un proyecto aparecerá aquí.</p>
            </div>

            <div id="errorBox" style="display:none;text-align:center;padding:60px 20px;">
                <i class="fa-solid fa-circle-exclamation" style="font-size:3rem;color:#f87171;margin-bottom:16px;display:block;"></i>
                <p id="errorMsg" style="color:#64748b;">Ocurrió un error al cargar tus proyectos.</p>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('btnMenuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('visible');
        });
        document.getElementById('sidebarOverlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('visible');
        });

        const currentPage = location.pathname.split('/').pop() || 'index.html';
        document.querySelectorAll('.sidebar-menu a').forEach(a => {
            if (a.getAttribute('href') === currentPage) a.classList.add('active');
        });

        function fmt(f) {
            if (!f || f === '0000-00-00') return '-';
            const [y, m, d] = f.split('-');
            return `${d}/${m}/${y}`;
        }
        function escH(s) {
            const d = document.createElement('div');
            d.textContent = s ?? '';
            return d.innerHTML;
        }

        const estadoBadge = {
            'Pendiente':  'badge-pendiente',
            'En Proceso': 'badge-proceso',
            'Completado': 'badge-completado',
            'Cancelado':  'badge-anulada'
        };

        function renderCards(proyectos) {
            document.getElementById('loadingBox').style.display = 'none';

            if (!proyectos || proyectos.length === 0) {
                document.getElementById('emptyBox').style.display = 'block';
                return;
            }

            const grid = document.getElementById('cardsGrid');
            grid.style.display = 'grid';
            grid.innerHTML = proyectos.map(p => `
                <div class="project-card">
                    <div class="card-nombre">${escH(p.nombre)}</div>
                    <span class="badge-sv ${estadoBadge[p.estado] || 'badge-pendiente'}">${escH(p.estado)}</span>
                    <hr class="card-divider">
                    ${p.cliente ? `<div class="card-detail"><i class="fa-solid fa-building"></i><span>${escH(p.cliente)}</span></div>` : ''}
                    ${p.descripcion ? `<div class="card-detail"><i class="fa-solid fa-align-left"></i><span>${escH(p.descripcion)}</span></div>` : ''}
                    <div class="card-detail">
                        <i class="fa-regular fa-calendar"></i>
                        <span>${fmt(p.fechaInicio)} → ${fmt(p.fechaEntrega)}</span>
                    </div>
                    ${p.id ? `<p class="card-id">Proyecto #${p.id}</p>` : ''}
                </div>`).join('');
        }

        function mostrarError(msg) {
            document.getElementById('loadingBox').style.display = 'none';
            document.getElementById('errorBox').style.display = 'block';
            document.getElementById('errorMsg').textContent = msg;
        }

        async function init() {
            try {
                const resSesion = await fetch('php/dashboard_data.php');
                const sesion = await resSesion.json();

                if (sesion.error) { window.location.href = 'login.html'; return; }
                if (sesion.rol !== 'Empleado') { window.location.href = 'dashboard.html'; return; }

                document.getElementById('sidebarNombre').textContent = sesion.usuario || sesion.nombre || '';
                document.getElementById('sidebarRol').textContent = sesion.rol || '';
                document.getElementById('saludo').textContent = 'Bienvenido, ' + (sesion.usuario || sesion.nombre || '');

                const resProy = await fetch('php/proyectos_empleado.php');
                const proyectos = await resProy.json();

                if (!Array.isArray(proyectos)) {
                    mostrarError(proyectos.mensaje || 'Error al cargar proyectos.');
                    return;
                }
                renderCards(proyectos);

            } catch (e) {
                mostrarError('No se pudo conectar con el servidor.');
            }
        }

        async function cerrarSesion() {
            try { await fetch('php/logout.php'); } catch (e) {}
            window.location.href = 'login.html';
        }

        init();
    </script>
</body>
</html>
